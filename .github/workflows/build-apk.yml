name: Build Naghme APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Align package versions with Expo SDK
        run: npx expo install --fix

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk naghme-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Naghme build ${{ github.run_number }}
          body: "برای نصب، فایل naghme-${{ github.run_number }}.apk را روی گوشی دانلود و باز کنید."
          files: naghme-${{ github.run_number }}.apk
          make_latest: true
